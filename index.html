<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyFairDay — Free Small Claims Document Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

<!-- React (no build step needed — this is the UMD/browser version) -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel lets the browser understand JSX directly, so no build tool is required -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ---------------------------------------------------------------------------
// IMPORTANT: point this at your live backend (the one you deployed on Render).
// ---------------------------------------------------------------------------
const BACKEND_URL = "https://api.myfairday.org/api/assist";

// ---------------------------------------------------------------------------
// Small inline icons (no external icon library needed — keeps this a single file)
// ---------------------------------------------------------------------------
const Icon = ({ children, size = 18, color = "currentColor", strokeWidth = 1.8 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const IconSend = (p) => <Icon {...p}><path d="M22 2L11 13" /><path d="M22 2L15 22L11 13L2 9L22 2Z" /></Icon>;
const IconLandmark = (p) => <Icon {...p}><path d="M3 21h18" /><path d="M4 21V9" /><path d="M20 21V9" /><path d="M2 9l10-6l10 6" /><path d="M8 21v-6" /><path d="M12 21v-6" /><path d="M16 21v-6" /></Icon>;
const IconShieldCheck = (p) => <Icon {...p}><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6l7-3Z" /><path d="M9 12l2 2l4-4" /></Icon>;
const IconGlobe = (p) => <Icon {...p}><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3c2.5 2.5 2.5 15.5 0 18" /><path d="M12 3c-2.5 2.5-2.5 15.5 0 18" /></Icon>;
const IconRotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></Icon>;
const IconCopy = (p) => <Icon {...p}><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></Icon>;
const IconCheck = (p) => <Icon {...p}><path d="M20 6L9 17L4 12" /></Icon>;
const IconScroll = (p) => <Icon {...p}><rect x="5" y="3" width="14" height="18" rx="1" /><path d="M8 8h8" /><path d="M8 12h8" /><path d="M8 16h5" /></Icon>;

// ---------------------------------------------------------------------------
// Safety contract used by the backend — shown here only for reference.
// (The real enforcement lives server-side in server.js.)
// ---------------------------------------------------------------------------

const STRINGS = {
  en: {
    wordmark: "MyFairDay",
    tagline: "Free small-claims document help for India",
    disclaimerTitle: "Before you begin",
    disclaimerBody:
      "This tool helps you organize facts into a court document format. It does not give legal advice and is not a substitute for a licensed advocate. Please have a lawyer review your document before filing.",
    disclaimerAccept: "I understand — let's begin",
    chatIntro:
      "Tell me what happened, in your own words. I'll help turn it into formal document language.",
    inputPlaceholder: "Describe what happened…",
    plaintiffLabel: "Your full name",
    defendantLabel: "Other party's full name",
    amountLabel: "Amount owed (₹)",
    dateLabel: "When did this happen?",
    continueBtn: "Continue",
    generateBtn: "Generate draft",
    startOver: "Start over",
    copyBtn: "Copy document text",
    copied: "Copied",
    docTitle: "PLAINT FOR RECOVERY OF MONEY",
    docSubtitle: "Small Cause / Small Claim",
    docPlaintiff: "PLAINTIFF",
    docDefendant: "DEFENDANT",
    docFacts: "BRIEF FACTS OF THE CASE",
    docAmount: "AMOUNT CLAIMED",
    docWatermark: "DRAFT — FOR ADVOCATE REVIEW",
    sealed: "Draft ready",
    thinking: "Organizing…",
    detailsIntro: "Just a few more details for the document:",
  },
  hi: {
    wordmark: "MyFairDay",
    tagline: "भारत में लघु वाद हेतु मुफ़्त दस्तावेज़ सहायता",
    disclaimerTitle: "शुरू करने से पहले",
    disclaimerBody:
      "यह उपकरण आपके तथ्यों को न्यायालय दस्तावेज़ के प्रारूप में व्यवस्थित करने में मदद करता है। यह कानूनी सलाह नहीं देता और किसी लाइसेंस-प्राप्त अधिवक्ता का विकल्प नहीं है। दाखिल करने से पहले कृपया किसी वकील से दस्तावेज़ की समीक्षा करवाएँ।",
    disclaimerAccept: "मैं समझता/समझती हूँ — शुरू करें",
    chatIntro:
      "अपने शब्दों में बताएं कि क्या हुआ। मैं इसे औपचारिक दस्तावेज़ भाषा में बदलने में मदद करूँगा।",
    inputPlaceholder: "जो हुआ उसका वर्णन करें…",
    plaintiffLabel: "आपका पूरा नाम",
    defendantLabel: "दूसरे पक्ष का पूरा नाम",
    amountLabel: "बकाया राशि (₹)",
    dateLabel: "यह कब हुआ?",
    continueBtn: "जारी रखें",
    generateBtn: "प्रारूप बनाएं",
    startOver: "फिर से शुरू करें",
    copyBtn: "दस्तावेज़ टेक्स्ट कॉपी करें",
    copied: "कॉपी हो गया",
    docTitle: "धन वसूली हेतु वाद-पत्र",
    docSubtitle: "लघु वाद न्यायालय",
    docPlaintiff: "वादी",
    docDefendant: "प्रतिवादी",
    docFacts: "मामले के संक्षिप्त तथ्य",
    docAmount: "दावा की गई राशि",
    docWatermark: "प्रारूप — अधिवक्ता समीक्षा हेतु",
    sealed: "प्रारूप तैयार",
    thinking: "व्यवस्थित हो रहा है…",
    detailsIntro: "दस्तावेज़ के लिए बस कुछ और विवरण चाहिए:",
  },
};

async function callAssistant(userText) {
  try {
    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: userText }),
    });
    const safeParsed = await response.json();
    return safeParsed;
  } catch (e) {
    return {
      mode: "redirect",
      reply: "Sorry, the assistant is temporarily unavailable. Please try again in a moment.",
      formal_summary: "",
      amount_detected: "",
      date_detected: "",
    };
  }
}

function FieldBlock({ label, value, wide }) {
  const isFilled = value && value.length > 0;
  return (
    <div style={{ ...styles.fieldBlock, ...(wide ? { gridColumn: "1 / -1" } : {}) }}>
      <div style={styles.fieldBlockLabel}>{label}</div>
      <div style={{ ...styles.fieldBlockValue, ...(isFilled ? styles.fieldBlockValueFilled : {}) }}>
        {value || "—"}
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("en");
  const t = STRINGS[lang];
  const [accepted, setAccepted] = useState(false);
  const [stage, setStage] = useState("chat");
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [thinking, setThinking] = useState(false);
  const [copied, setCopied] = useState(false);
  const scrollRef = useRef(null);

  const [doc, setDoc] = useState({ plaintiff: "", defendant: "", amount: "", date: "", facts: "" });
  const [details, setDetails] = useState({ plaintiff: "", defendant: "", amount: "", date: "" });

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, thinking]);

  const send = async () => {
    const text = input.trim();
    if (!text || thinking) return;
    setMessages((m) => [...m, { role: "user", text }]);
    setInput("");
    setThinking(true);
    const result = await callAssistant(text);
    setThinking(false);
    setMessages((m) => [...m, { role: "assistant", text: result.reply }]);
    if (result.mode === "extract") {
      setDoc((d) => ({
        ...d,
        facts: result.formal_summary || d.facts,
        amount: result.amount_detected || d.amount,
        date: result.date_detected || d.date,
      }));
      setDetails((d) => ({
        ...d,
        amount: result.amount_detected || d.amount,
        date: result.date_detected || d.date,
      }));
      setTimeout(() => setStage("details"), 600);
    }
  };

  const finalizeDetails = () => {
    setDoc((d) => ({ ...d, ...details }));
    setStage("done");
  };

  const reset = () => {
    setMessages([]);
    setDoc({ plaintiff: "", defendant: "", amount: "", date: "", facts: "" });
    setDetails({ plaintiff: "", defendant: "", amount: "", date: "" });
    setStage("chat");
    setInput("");
  };

  const docText = `${t.docTitle}\n${t.docSubtitle}\n\n${t.docPlaintiff}: ${doc.plaintiff || "—"}\n${t.docDefendant}: ${doc.defendant || "—"}\n${t.docAmount}: ₹ ${doc.amount || "—"}\n\n${t.docFacts}:\n${doc.facts || "—"}`;

  const copyDoc = () => {
    navigator.clipboard.writeText(docText).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div style={styles.wordmarkRow}>
          <IconLandmark size={22} color={INK} strokeWidth={1.6} />
          <div>
            <div style={styles.wordmark}>{t.wordmark}</div>
            <div style={styles.tagline}>{t.tagline}</div>
          </div>
        </div>
        <button style={styles.langToggle} onClick={() => setLang(lang === "en" ? "hi" : "en")}>
          <IconGlobe size={15} strokeWidth={1.8} />
          {lang === "en" ? "हिंदी" : "English"}
        </button>
      </header>

      {!accepted ? (
        <div style={styles.gateWrap}>
          <div style={styles.gateCard}>
            <IconShieldCheck size={28} color={SEAL} strokeWidth={1.5} />
            <h2 style={styles.gateTitle}>{t.disclaimerTitle}</h2>
            <p style={styles.gateBody}>{t.disclaimerBody}</p>
            <button style={styles.primaryBtn} onClick={() => setAccepted(true)}>{t.disclaimerAccept}</button>
          </div>
        </div>
      ) : (
        <main style={styles.main}>
          <section style={styles.chatPanel}>
            <div style={styles.chatScroll} ref={scrollRef}>
              <div style={styles.introBubble}>{t.chatIntro}</div>
              {messages.map((m, i) => (
                <div key={i} style={{ ...styles.bubble, ...(m.role === "user" ? styles.bubbleUser : styles.bubbleBot) }}>
                  {m.text}
                </div>
              ))}
              {thinking && (
                <div style={{ ...styles.bubble, ...styles.bubbleBot, ...styles.bubbleThinking }}>{t.thinking}</div>
              )}

              {stage === "details" && (
                <div style={styles.detailsCard}>
                  <div style={styles.detailsIntro}>{t.detailsIntro}</div>
                  <label style={styles.fieldLabel}>{t.plaintiffLabel}</label>
                  <input style={styles.fieldInput} value={details.plaintiff}
                    onChange={(e) => setDetails({ ...details, plaintiff: e.target.value })} />
                  <label style={styles.fieldLabel}>{t.defendantLabel}</label>
                  <input style={styles.fieldInput} value={details.defendant}
                    onChange={(e) => setDetails({ ...details, defendant: e.target.value })} />
                  <label style={styles.fieldLabel}>{t.amountLabel}</label>
                  <input style={styles.fieldInput} value={details.amount}
                    onChange={(e) => setDetails({ ...details, amount: e.target.value })} />
                  <label style={styles.fieldLabel}>{t.dateLabel}</label>
                  <input style={styles.fieldInput} value={details.date}
                    onChange={(e) => setDetails({ ...details, date: e.target.value })} />
                  <button style={styles.primaryBtn} onClick={finalizeDetails}>{t.generateBtn}</button>
                </div>
              )}
            </div>

            {stage === "chat" && (
              <div style={styles.inputRow}>
                <input style={styles.chatInput} placeholder={t.inputPlaceholder} value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && send()} />
                <button style={styles.sendBtn} onClick={send} disabled={thinking}>
                  <IconSend size={16} strokeWidth={2} color="#fff" />
                </button>
              </div>
            )}

            {stage === "done" && (
              <div style={styles.inputRow}>
                <button style={styles.secondaryBtn} onClick={reset}>
                  <IconRotateCcw size={14} strokeWidth={2} /> {t.startOver}
                </button>
                <button style={styles.primaryBtn} onClick={copyDoc}>
                  {copied ? <IconCheck size={15} /> : <IconCopy size={15} />} {copied ? t.copied : t.copyBtn}
                </button>
              </div>
            )}
          </section>

          <section style={styles.docPanel}>
            <div style={styles.paper}>
              <div style={styles.watermark}>{t.docWatermark}</div>
              <div style={styles.paperHeaderRow}>
                <IconScroll size={16} color={INK_SOFT} strokeWidth={1.5} />
                <span style={styles.paperEyebrow}>{t.docSubtitle}</span>
              </div>
              <h1 style={styles.paperTitle}>{t.docTitle}</h1>
              <div style={styles.divider} />
              <div style={styles.partyGrid}>
                <FieldBlock label={t.docPlaintiff} value={doc.plaintiff} />
                <FieldBlock label={t.docDefendant} value={doc.defendant} />
              </div>
              <FieldBlock label={t.docAmount} value={doc.amount ? `₹ ${doc.amount}` : ""} wide />
              <div style={styles.factsLabel}>{t.docFacts}</div>
              <div style={{ ...styles.factsBox, ...(doc.facts ? styles.factsBoxFilled : {}) }}>
                {doc.facts || "···························································"}
              </div>
              {stage === "done" && (
                <div style={styles.sealWrap}>
                  <div style={styles.seal}><IconShieldCheck size={22} color="#fff" strokeWidth={2} /></div>
                  <span style={styles.sealLabel}>{t.sealed}</span>
                </div>
              )}
            </div>
          </section>
        </main>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// Design tokens
// ---------------------------------------------------------------------------
const INK = "#16233B";
const INK_SOFT = "#5B6572";
const PAPER = "#F1F2EC";
const PAPER_WHITE = "#FBFBF8";
const SEAL = "#B8863B";
const LINE = "#D8D9CE";

const styles = {
  app: { fontFamily: "'IBM Plex Sans','Noto Sans Devanagari',system-ui,sans-serif", background: PAPER, minHeight: "100vh", color: INK, display: "flex", flexDirection: "column" },
  header: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "18px 28px", borderBottom: `1px solid ${LINE}`, background: PAPER_WHITE },
  wordmarkRow: { display: "flex", alignItems: "center", gap: 10 },
  wordmark: { fontFamily: "'Source Serif 4',Georgia,serif", fontWeight: 700, fontSize: 18 },
  tagline: { fontSize: 11.5, color: INK_SOFT, marginTop: 1 },
  langToggle: { display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1px solid ${LINE}`, borderRadius: 20, padding: "6px 14px", fontSize: 12.5, color: INK, cursor: "pointer", fontFamily: "inherit" },
  gateWrap: { flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 },
  gateCard: { background: PAPER_WHITE, border: `1px solid ${LINE}`, borderRadius: 10, padding: "32px 30px", maxWidth: 380, textAlign: "center" },
  gateTitle: { fontFamily: "'Source Serif 4',Georgia,serif", fontSize: 20, margin: "14px 0 10px" },
  gateBody: { fontSize: 13.5, color: INK_SOFT, lineHeight: 1.6, marginBottom: 22 },
  main: { flex: 1, display: "flex", flexWrap: "wrap", gap: 20, padding: 20, maxWidth: 1180, margin: "0 auto", width: "100%" },
  chatPanel: { flex: "1 1 380px", minWidth: 320, background: PAPER_WHITE, border: `1px solid ${LINE}`, borderRadius: 10, display: "flex", flexDirection: "column", height: 560 },
  chatScroll: { flex: 1, overflowY: "auto", padding: 18, display: "flex", flexDirection: "column", gap: 10 },
  introBubble: { fontSize: 13.5, color: INK_SOFT, background: PAPER, borderRadius: 10, padding: "10px 14px", lineHeight: 1.5 },
  bubble: { maxWidth: "85%", padding: "10px 14px", borderRadius: 12, fontSize: 13.5, lineHeight: 1.5 },
  bubbleUser: { alignSelf: "flex-end", background: INK, color: "#fff" },
  bubbleBot: { alignSelf: "flex-start", background: PAPER, color: INK },
  bubbleThinking: { color: INK_SOFT, fontStyle: "italic" },
  detailsCard: { background: PAPER, borderRadius: 10, padding: 16, display: "flex", flexDirection: "column", gap: 4 },
  detailsIntro: { fontSize: 12.5, color: INK_SOFT, marginBottom: 8 },
  fieldLabel: { fontFamily: "'IBM Plex Mono',monospace", fontSize: 10.5, letterSpacing: "0.04em", color: INK_SOFT, textTransform: "uppercase", marginTop: 8 },
  fieldInput: { border: `1px solid ${LINE}`, borderRadius: 6, padding: "8px 10px", fontSize: 13.5, fontFamily: "inherit", background: "#fff", marginTop: 4, marginBottom: 4 },
  inputRow: { display: "flex", gap: 8, padding: 14, borderTop: `1px solid ${LINE}` },
  chatInput: { flex: 1, border: `1px solid ${LINE}`, borderRadius: 20, padding: "10px 16px", fontSize: 13.5, fontFamily: "inherit" },
  sendBtn: { width: 38, height: 38, borderRadius: "50%", background: INK, border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" },
  primaryBtn: { background: INK, color: "#fff", border: "none", borderRadius: 20, padding: "10px 20px", fontSize: 13, fontWeight: 500, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontFamily: "inherit", marginTop: 10 },
  secondaryBtn: { background: "transparent", color: INK_SOFT, border: `1px solid ${LINE}`, borderRadius: 20, padding: "10px 16px", fontSize: 12.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, fontFamily: "inherit" },
  docPanel: { flex: "1 1 420px", minWidth: 340 },
  paper: { background: "#fff", border: `1px solid ${LINE}`, borderRadius: 4, padding: "30px 32px", position: "relative", minHeight: 560, boxShadow: "0 1px 3px rgba(22,35,59,0.06)", overflow: "hidden" },
  watermark: { position: "absolute", top: 14, right: 16, fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, letterSpacing: "0.08em", color: "#C6B79A", border: "1px solid #E4D9C2", borderRadius: 3, padding: "2px 8px" },
  paperHeaderRow: { display: "flex", alignItems: "center", gap: 6, marginBottom: 4 },
  paperEyebrow: { fontFamily: "'IBM Plex Mono',monospace", fontSize: 10.5, letterSpacing: "0.08em", textTransform: "uppercase", color: INK_SOFT },
  paperTitle: { fontFamily: "'Source Serif 4',Georgia,serif", fontSize: 21, fontWeight: 700, margin: "4px 0 14px", lineHeight: 1.3 },
  divider: { borderTop: `1px solid ${LINE}`, marginBottom: 18 },
  partyGrid: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 14 },
  fieldBlock: { minWidth: 0 },
  fieldBlockLabel: { fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, letterSpacing: "0.06em", color: INK_SOFT, textTransform: "uppercase", marginBottom: 4 },
  fieldBlockValue: { fontSize: 13.5, color: "#B7B9AE", borderBottom: `1px dashed ${LINE}`, paddingBottom: 6, wordBreak: "break-word" },
  fieldBlockValueFilled: { color: INK, borderBottom: `1px solid ${INK}` },
  factsLabel: { fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, letterSpacing: "0.06em", color: INK_SOFT, textTransform: "uppercase", margin: "16px 0 6px" },
  factsBox: { fontSize: 13.5, lineHeight: 1.7, color: "#C7C9BD", minHeight: 80 },
  factsBoxFilled: { color: INK },
  sealWrap: { position: "absolute", bottom: 22, right: 26, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 },
  seal: { width: 46, height: 46, borderRadius: "50%", background: SEAL, display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 6px rgba(184,134,59,0.4)" },
  sealLabel: { fontFamily: "'IBM Plex Mono',monospace", fontSize: 9.5, color: SEAL, letterSpacing: "0.04em" },
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
