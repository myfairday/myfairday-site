<script>
  // Função principal chamada pelo botão "Investigar"
  function rodarInvestigacao() {
    const input = document.getElementById("userInput") || document.querySelector("textarea") || document.querySelector("input[type='text']");
    const containerResultados = document.getElementById("chat-box") || document.getElementById("results") || document.getElementById("output");

    if (!input || !input.value.trim()) {
      alert("Por favor, digite ou cole um texto para analisar.");
      return;
    }

    const texto = input.value.trim();

    // 1. Executa Análise do Tracer (URLs e Links)
    const urlRegex = /(https?:\/\/[^\s]+|(?:www\.|[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?)/gi;
    const links = texto.match(urlRegex) || [];
    let tracerOutput = "";
    let tracerScore = 0;

    if (links.length > 0) {
      tracerOutput = `🔍 **TRACER:** Identifiquei ${links.length} link(s) na mensagem: \`${links.join(", ")}\`. `;
      if (texto.toLowerCase().includes("http://")) {
        tracerOutput += "⚠️ Conexão insegura (HTTP).";
        tracerScore += 30;
      } else {
        tracerOutput += "✅ Estrutura de links verificada.";
      }
    } else {
      tracerOutput = "🔍 **TRACER:** Nenhum link direto foi encontrado no texto fornecido.";
    }

    // 2. Executa Análise do Warden (Identidade/E-mail)
    let wardenOutput = "";
    let wardenScore = 0;
    if (texto.toLowerCase().includes("@gmail.com") && (texto.toLowerCase().includes("banco") || texto.toLowerCase().includes("suporte"))) {
      wardenOutput = "🛡️ **WARDEN:** ⚠️ Alerta de remetente! Uso de provedor gratuito (@gmail) tentando se passar por instituição financeira.";
      wardenScore += 40;
    } else {
      wardenOutput = "🛡️ **WARDEN:** ✅ Nenhuma falsificação direta de remetente corporativo detectada.";
    }

    // 3. Executa Análise do Cipher (Engenharia Social)
    const palavrasChave = ["urgente", "bloqueio", "multa", "pix", "senha", "expira", "cancelamento"];
    let achadas = palavrasChave.filter(p => texto.toLowerCase().includes(p));
    let cipherOutput = "";
    let cipherScore = achadas.length * 20;

    if (achadas.length > 0) {
      cipherOutput = `🧠 **CIPHER:** ⚠️ Pressão psicológica detectada! Termos de urgência encontrados: [${achadas.join(", ")}].`;
    } else {
      cipherOutput = "🧠 **CIPHER:** ✅ O tom da mensagem é neutro e sem gatilhos de intimidação imediata.";
    }

    // 4. Veredito do Scout
    const scoreTotal = tracerScore + wardenScore + cipherScore;
    let scoutOutput = "";
    if (scoreTotal >= 40) {
      scoutOutput = `🚨 **SCOUT (VEREDITO): ALTO RISCO DE GOLPE** (Pontuação: ${scoreTotal}/100). Recomendação: Não clique em links e não realize transferências.`;
    } else {
      scoutOutput = `🟢 **SCOUT (VEREDITO): BAIXO RISCO** (Pontuação: ${scoreTotal}/100). Nenhum padrão de fraude evidente foi identificado.`;
    }

    // Exibe o resultado na tela preenchendo o elemento de chat/resultado
    if (containerResultados) {
      containerResultados.innerHTML += `
        <div style="background: #1e293b; padding: 15px; margin-top: 10px; border-radius: 8px; border-left: 4px solid #3b82f6; text-align: left; color: #fff;">
          <p><strong>Sua Mensagem:</strong> "${texto}"</p>
          <hr style="border-color: #334155;">
          <p>${tracerOutput}</p>
          <p>${wardenOutput}</p>
          <p>${cipherOutput}</p>
          <p style="font-weight: bold; margin-top: 10px;">${scoutOutput}</p>
        </div>
      `;
    } else {
      alert(`${tracerOutput}\n\n${wardenOutput}\n\n${cipherOutput}\n\n${scoutOutput}`);
    }

    input.value = "";
  }
</script>
