const { useState, useRef, useEffect } = React;

// ---------------------------------------------------------------------------
// CONFIG — edit these for your real setup.
// ---------------------------------------------------------------------------
const API_BASE = "https://api.myfairday.org";
const ASSIST_URL = API_BASE + "/api/assist";       // single-agent chat
const CREW_URL = API_BASE + "/api/crew-investigate"; // multi-agent OSINT run (server-side CrewAI)
const LICENSE_URL = API_BASE + "/api/verify-license";
const USAGE_URL = API_BASE + "/api/usage";
const GUMROAD_CHECKOUT_URL = "https://gumroad.com/l/YOUR-PRODUCT-HERE"; // <-- replace
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"; // <-- replace
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY"; // <-- replace
const FREE_LIMIT = 4;

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------------------------------------------------------------------------
// The Crew — four ORIGINAL characters, each mapped to one concrete OSINT
// task. This is intentionally NOT based on any copyrighted character, logo,
// or costume — using Spider-Man/Batman/Superman/Chapolin Colorado as
// avatars would infringe third-party IP (Marvel/Disney, DC, Chespirito),
// which is a real legal exposure for a commercial product. These four
// keep the "team of heroes" feel with original names, colors and emblems.
//
// NOTE ON ARCHITECTURE: the actual multi-agent orchestration (a real
// CrewAI-style pipeline where each agent hands off work to the next) has
// to run server-side in Python/CrewAI — a browser can't run that framework.
// This front end just calls CREW_URL with the user's input, and expects
// the backend to return an ordered array of agent turns plus a final
// verdict from Scout. See the mock fallback in runCrewInvestigation()
// for the exact shape expected.
// ---------------------------------------------------------------------------
const CREW = [
  { id: "tracer", name: "Tracer", role: "Link & Domain Investigator", color: "#6E7CE0",
    blurb: "Traces suspicious URLs — domain age, registrar, redirect chains, hosting reputation." },
  { id: "warden", name: "Warden", role: "Sender Verification", color: "#E0A63B",
    blurb: "Checks who's really behind a contact, profile, or email — impersonation red flags." },
  { id: "cipher", name: "Cipher", role: "Phishing & Social Engineering Analyst", color: "#3BC9A8",
    blurb: "Breaks down the manipulation tactic used in a message — urgency, fear, fake authority." },
  { id: "scout", name: "Scout", role: "Verdict & Cross-Check", color: "#E0673B",
    blurb: "Cross-references what the rest of the crew found and gives you the final verdict." },
];

// ---------------------------------------------------------------------------
// Inline icons
// ---------------------------------------------------------------------------
const Icon = ({ children, size = 18, color = "currentColor", strokeWidth = 1.8 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const IconSend = (p) => <Icon {...p}><path d="M22 2L11 13" /><path d="M22 2L15 22L11 13L2 9L22 2Z" /></Icon>;
const IconShield = (p) => <Icon {...p}><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6l7-3Z" /></Icon>;
const IconShieldCheck = (p) => <Icon {...p}><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9c-4-1.5-7-4.5-7-9V6l7-3Z" /><path d="M9 12l2 2l4-4" /></Icon>;
const IconRotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></Icon>;
const IconCheck = (p) => <Icon {...p}><path d="M20 6L9 17L4 12" /></Icon>;
const IconLock = (p) => <Icon {...p}><rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></Icon>;
const IconExternal = (p) => <Icon {...p}><path d="M14 4h6v6" /><path d="M10 14L20 4" /><path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5" /></Icon>;
const IconUser = (p) => <Icon {...p}><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></Icon>;
const IconLogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" /></Icon>;
const IconCoffee = (p) => <Icon {...p}><path d="M17 8h1a3 3 0 0 1 0 6h-1" /><path d="M3 8h14v6a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8Z" /><path d="M6 2v2" /><path d="M10 2v2" /><path d="M14 2v2" /></Icon>;
const IconUsers = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;

// Simple abstract emblem per character — built from shapes only, no
// copied logos, costumes, or third-party IP.
function Emblem({ id, color, size = 40 }) {
  const common = { width: size, height: size, viewBox: "0 0 40 40" };
  if (id === "tracer") return (
    <svg {...common}><circle cx="20" cy="20" r="18" fill={color} opacity="0.15" /><path d="M20 6a14 14 0 1 0 10 24 11 11 0 0 1-10-24Z" fill={color} /></svg>
  );
  if (id === "warden") return (
    <svg {...common}><circle cx="20" cy="20" r="18" fill={color} opacity="0.15" /><circle cx="20" cy="20" r="8" fill={color} />
      {[0,45,90,135,180,225,270,315].map((a,i)=>(<rect key={i} x="19" y="2" width="2" height="7" fill={color} transform={`rotate(${a} 20 20)`} />))}
    </svg>
  );
  if (id === "cipher") return (
    <svg {...common}><circle cx="20" cy="20" r="18" fill={color} opacity="0.15" />
      <circle cx="20" cy="20" r="3" fill={color} />
      {[0,60,120,180,240,300].map((a,i)=>(<line key={i} x1="20" y1="20" x2="20" y2="4" stroke={color} strokeWidth="1.6" transform={`rotate(${a} 20 20)`} />))}
      <circle cx="20" cy="20" r="8" fill="none" stroke={color} strokeWidth="1.4" opacity="0.6" />
      <circle cx="20" cy="20" r="13" fill="none" stroke={color} strokeWidth="1.4" opacity="0.4" />
    </svg>
  );
  return (
    <svg {...common}><circle cx="20" cy="20" r="18" fill={color} opacity="0.15" />
      <ellipse cx="20" cy="20" rx="12" ry="10" fill={color} />
      <circle cx="20" cy="12" r="4" fill={color} />
      <circle cx="16" cy="19" r="1.6" fill="#fff" /><circle cx="24" cy="19" r="1.6" fill="#fff" />
      <circle cx="16" cy="24" r="1.6" fill="#fff" /><circle cx="24" cy="24" r="1.6" fill="#fff" />
    </svg>
  );
}

// ---------------------------------------------------------------------------
// Copy — single language, globally-worded (no country-specific assumptions).
// ---------------------------------------------------------------------------
const T = {
  wordmark: "MyFairDay",
  tagline: "The Cyber Crew — stay safe online",
  navHome: "Home", navAssistant: "Talk to the Crew",
  heroEyebrow: "FOUR AGENTS. ONE INVESTIGATION.",
  heroTitle: "Meet your Cyber Crew. Stay safe for less than a coffee — $4.50.",
  heroSub: "Four AI agents, each with one job, work together to check suspicious links, messages, and senders before they hurt you. Create a free account and ask your first 4 questions free.",
  heroCta: "Meet the Crew — 4 questions free",
  resourcesTitle: "Official resources (verified, not AI-generated)",
  resourcesNote: "Cybercrime reporting is handled by national authorities. These are internationally recognized starting points — look up the equivalent agency in your own country too.",
  resources: [
    { label: "econsumer.gov — report cross-border scams (ICPEN network)", url: "https://www.econsumer.gov" },
    { label: "INTERPOL — Cybercrime", url: "https://www.interpol.int/en/Crimes/Cybercrime" },
    { label: "IC3 — FBI Internet Crime Complaint Center (US)", url: "https://www.ic3.gov" },
  ],
  pickTitle: "Choose how you want to investigate",
  pickSingleHint: "Talk to one agent",
  pickCrewHint: "Or run a full crew investigation",
  crewCta: "Run Crew Investigation",
  authTitle: "Sign in to continue", authTitleSignup: "Create your free account",
  emailLabel: "Email", passwordLabel: "Password",
  loginBtn: "Log in", signupBtn: "Create account",
  switchToSignup: "New here? Create an account",
  switchToLogin: "Already have an account? Log in",
  authLoading: "Please wait…",
  checkEmail: "Check your email to confirm your account, then log in.",
  logout: "Log out",
  disclaimerTitle: "Before you begin",
  disclaimerBody: "The Crew gives general, educational cybersecurity guidance. It is not a substitute for professional incident response or law enforcement. Never paste real passwords, OTPs, or card numbers into this chat.",
  disclaimerAccept: "Got it — let's go",
  chatIntroFor: (name) => `You're talking to ${name}. What's going on?`,
  crewIntro: "Describe the link, message, or sender you want the Crew to investigate. Each agent will check their part, then Scout gives the final verdict.",
  inputPlaceholder: "Describe what happened or paste a suspicious message…",
  thinking: "Thinking…",
  investigating: (name) => `${name} is investigating…`,
  questionsLeft: (n) => n === 1 ? "1 free question left" : `${n} free questions left`,
  unlockedBadge: "Unlimited access",
  paywallTitle: "You've used your 4 free questions",
  paywallBody: "Unlock unlimited help from the whole Crew — a one-time payment, less than a coffee.",
  paywallCta: "Get instant access — $4.50",
  haveCode: "Already paid? Enter your code",
  licensePlaceholder: "Paste your license key",
  unlockBtn: "Unlock", unlocking: "Checking…",
  licenseInvalid: "That code didn't work. Please check it and try again.",
  switchCharacter: "Back to picker",
  startOver: "Start over",
};

async function getAccessToken() {
  const { data } = await sb.auth.getSession();
  return data && data.session ? data.session.access_token : null;
}
async function authedFetch(url, options = {}) {
  const token = await getAccessToken();
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (token) headers.Authorization = `Bearer ${token}`;
  return fetch(url, { ...options, headers });
}
async function callAssistant(userText, character) {
  try {
    const response = await authedFetch(ASSIST_URL, { method: "POST", body: JSON.stringify({ text: userText, character }) });
    return await response.json();
  } catch (e) {
    return { mode: "decline", reply: "Sorry, the crew is temporarily unavailable. Please try again in a moment." };
  }
}
// Expected server response shape from CREW_URL (real CrewAI orchestration
// runs here, server-side):
// {
//   turns: [ { agent: "tracer", text: "..." }, { agent: "warden", text: "..." },
//            { agent: "cipher", text: "..." } ],
//   verdict: "...",                // Scout's final message
//   questions_used: 2, unlocked: false
// }
async function callCrewInvestigation(userText) {
  try {
    const response = await authedFetch(CREW_URL, { method: "POST", body: JSON.stringify({ text: userText }) });
    return await response.json();
  } catch (e) {
    return { turns: [], verdict: "Sorry, the crew is temporarily unavailable. Please try again in a moment." };
  }
}
async function verifyLicense(key) {
  try {
    const response = await authedFetch(LICENSE_URL, { method: "POST", body: JSON.stringify({ license_key: key }) });
    const data = await response.json();
    return !!data.valid;
  } catch (e) { return false; }
}
async function fetchUsage() {
  try {
    const response = await authedFetch(USAGE_URL, { method: "GET" });
    if (!response.ok) return null;
    return await response.json();
  } catch (e) { return null; }
}

function App() {
  const t = T;
  const [tab, setTab] = useState("home");
  const [accepted, setAccepted] = useState(false);
  const [character, setCharacter] = useState(null); // agent id, or "crew"

  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [authMode, setAuthMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [authError, setAuthError] = useState("");
  const [authNotice, setAuthNotice] = useState("");

  const [questionsUsed, setQuestionsUsed] = useState(0);
  const [unlocked, setUnlocked] = useState(false);

  const [messages, setMessages] = useState([]); // { role: 'user' | 'agent', agentId?, name?, color?, text }
  const [input, setInput] = useState("");
  const [thinking, setThinking] = useState(false);
  const [thinkingLabel, setThinkingLabel] = useState("");
  const scrollRef = useRef(null);

  const [licenseKey, setLicenseKey] = useState("");
  const [licenseError, setLicenseError] = useState("");
  const [verifying, setVerifying] = useState(false);
  const [showLicenseForm, setShowLicenseForm] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session || null); setAuthChecked(true); });
    const { data: listener } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (session) fetchUsage().then((u) => { if (u) { setQuestionsUsed(u.questions_used); setUnlocked(u.unlocked); } });
  }, [session]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, thinking]);

  const atLimit = !unlocked && questionsUsed >= FREE_LIMIT;
  const isCrewMode = character === "crew";
  const activeCrew = CREW.find((c) => c.id === character);

  const handleAuth = async () => {
    if (!email.trim() || !password.trim() || authLoading) return;
    setAuthLoading(true); setAuthError(""); setAuthNotice("");
    if (authMode === "signup") {
      const { error } = await sb.auth.signUp({ email: email.trim(), password });
      setAuthLoading(false);
      if (error) { setAuthError(error.message); return; }
      setAuthNotice(t.checkEmail);
    } else {
      const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
      setAuthLoading(false);
      if (error) { setAuthError(error.message); return; }
    }
  };

  const logout = async () => {
    await sb.auth.signOut();
    setSession(null); setTab("home"); setAccepted(false); setCharacter(null); setMessages([]);
  };

  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

  const sendSingle = async (text) => {
    setMessages((m) => [...m, { role: "user", text }]);
    setThinking(true); setThinkingLabel(t.thinking);
    const result = await callAssistant(text, character);
    setThinking(false);
    setMessages((m) => [...m, { role: "agent", agentId: activeCrew.id, name: activeCrew.name, color: activeCrew.color, text: result.reply || "…" }]);
    if (typeof result.questions_used === "number") setQuestionsUsed(result.questions_used);
    if (typeof result.unlocked === "boolean") setUnlocked(result.unlocked);
  };

  // Runs the four agents one after another so it reads like the Crew
  // talking through the case together, ending on Scout's verdict.
  const sendCrew = async (text) => {
    setMessages((m) => [...m, { role: "user", text }]);
    const result = await callCrewInvestigation(text);
    const turns = (result.turns && result.turns.length) ? result.turns : [];
    for (const turn of turns) {
      const agent = CREW.find((c) => c.id === turn.agent);
      if (!agent) continue;
      setThinking(true); setThinkingLabel(t.investigating(agent.name));
      await sleep(500); // paced reveal so it reads like a discussion, not a wall of text
      setThinking(false);
      setMessages((m) => [...m, { role: "agent", agentId: agent.id, name: agent.name, color: agent.color, text: turn.text }]);
    }
    if (result.verdict) {
      const scout = CREW.find((c) => c.id === "scout");
      setThinking(true); setThinkingLabel(t.investigating(scout.name));
      await sleep(500);
      setThinking(false);
      setMessages((m) => [...m, { role: "agent", agentId: "scout", name: scout.name, color: scout.color, text: result.verdict, verdict: true }]);
    }
    if (typeof result.questions_used === "number") setQuestionsUsed(result.questions_used);
    if (typeof result.unlocked === "boolean") setUnlocked(result.unlocked);
  };

  const send = async () => {
    const text = input.trim();
    if (!text || thinking || atLimit || !character) return;
    setInput("");
    if (isCrewMode) await sendCrew(text);
    else await sendSingle(text);
  };

  const handleUnlock = async () => {
    if (!licenseKey.trim() || verifying) return;
    setVerifying(true); setLicenseError("");
    const ok = await verifyLicense(licenseKey.trim());
    setVerifying(false);
    if (ok) {
      const u = await fetchUsage();
      if (u) { setQuestionsUsed(u.questions_used); setUnlocked(u.unlocked); }
    } else {
      setLicenseError(t.licenseInvalid);
    }
  };

  const switchCharacter = () => { setCharacter(null); setMessages([]); };

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div style={styles.wordmarkRow}>
          <IconShield size={22} color={ACCENT} strokeWidth={1.8} />
          <div>
            <div style={styles.wordmark}>{t.wordmark}</div>
            <div style={styles.tagline}>{t.tagline}</div>
          </div>
        </div>
        <div style={styles.headerRight}>
          <nav style={styles.tabNav}>
            <button style={{ ...styles.tabBtn, ...(tab === "home" ? styles.tabBtnActive : {}) }} onClick={() => setTab("home")}>{t.navHome}</button>
            <button style={{ ...styles.tabBtn, ...(tab === "assistant" ? styles.tabBtnActive : {}) }} onClick={() => setTab("assistant")}>{t.navAssistant}</button>
          </nav>
          {session && <button style={styles.ghostBtn} onClick={logout}><IconLogOut size={14} /> {t.logout}</button>}
        </div>
      </header>

      {tab === "home" && (
        <div style={styles.heroWrap}>
          <div style={styles.heroCard}>
            <div style={styles.heroEyebrow}>{t.heroEyebrow}</div>
            <h1 style={styles.heroTitle}>{t.heroTitle}</h1>
            <p style={styles.heroSub}>{t.heroSub}</p>
            <button style={styles.heroCtaBtn} onClick={() => setTab("assistant")}><IconCoffee size={16} /> {t.heroCta}</button>

            <div style={styles.crewGrid}>
              {CREW.map((c) => (
                <div key={c.id} style={{ ...styles.crewCardHome, borderColor: c.color + "55" }}>
                  <Emblem id={c.id} color={c.color} size={44} />
                  <div style={styles.crewNameHome}>{c.name}</div>
                  <div style={{ ...styles.crewTitleHome, color: c.color }}>{c.role}</div>
                  <div style={styles.crewBlurbHome}>{c.blurb}</div>
                </div>
              ))}
            </div>

            <div style={styles.resourcesBoxHome}>
              <div style={styles.resourcesTitle}>{t.resourcesTitle}</div>
              <div style={styles.resourcesNote}>{t.resourcesNote}</div>
              {t.resources.map((r, i) => (
                <a key={i} href={r.url} target="_blank" rel="noopener noreferrer" style={styles.resourceLink}><IconExternal size={13} /> {r.label}</a>
              ))}
            </div>
          </div>
        </div>
      )}

      {tab === "assistant" && authChecked && !session && (
        <div style={styles.gateWrap}>
          <div style={styles.gateCard}>
            <IconUser size={28} color={ACCENT} strokeWidth={1.5} />
            <h2 style={styles.gateTitle}>{authMode === "signup" ? t.authTitleSignup : t.authTitle}</h2>
            <input style={styles.fieldInput} type="email" placeholder={t.emailLabel} value={email} onChange={(e) => setEmail(e.target.value)} />
            <input style={styles.fieldInput} type="password" placeholder={t.passwordLabel} value={password} onChange={(e) => setPassword(e.target.value)} />
            {authError && <div style={styles.errorText}>{authError}</div>}
            {authNotice && <div style={styles.noticeText}>{authNotice}</div>}
            <button style={styles.primaryBtn} onClick={handleAuth} disabled={authLoading}>{authLoading ? t.authLoading : (authMode === "signup" ? t.signupBtn : t.loginBtn)}</button>
            <button style={styles.linkBtn} onClick={() => { setAuthMode(authMode === "signup" ? "login" : "signup"); setAuthError(""); setAuthNotice(""); }}>
              {authMode === "signup" ? t.switchToLogin : t.switchToSignup}
            </button>
          </div>
        </div>
      )}

      {tab === "assistant" && session && !accepted && (
        <div style={styles.gateWrap}>
          <div style={styles.gateCard}>
            <IconShieldCheck size={28} color={ACCENT} strokeWidth={1.5} />
            <h2 style={styles.gateTitle}>{t.disclaimerTitle}</h2>
            <p style={styles.gateBody}>{t.disclaimerBody}</p>
            <button style={styles.primaryBtn} onClick={() => setAccepted(true)}>{t.disclaimerAccept}</button>
          </div>
        </div>
      )}

      {tab === "assistant" && session && accepted && !character && (
        <div style={styles.pickWrap}>
          <h2 style={styles.pickTitle}>{t.pickTitle}</h2>
          <div style={styles.pickHint}>{t.pickSingleHint}</div>
          <div style={styles.crewGrid}>
            {CREW.map((c) => (
              <button key={c.id} style={{ ...styles.crewCard, borderColor: c.color }} onClick={() => setCharacter(c.id)}>
                <Emblem id={c.id} color={c.color} size={52} />
                <div style={styles.crewName}>{c.name}</div>
                <div style={{ ...styles.crewTitle, color: c.color }}>{c.role}</div>
                <div style={styles.crewBlurb}>{c.blurb}</div>
              </button>
            ))}
          </div>
          <div style={styles.pickHint}>{t.pickCrewHint}</div>
          <button style={styles.crewModeBtn} onClick={() => setCharacter("crew")}>
            <IconUsers size={18} /> {t.crewCta}
          </button>
        </div>
      )}

      {tab === "assistant" && session && accepted && character && (
        <main style={styles.main}>
          <section style={styles.chatPanel}>
            <div style={styles.chatHeaderRow}>
              {isCrewMode ? (
                <div style={styles.activeCrewBadge}><IconUsers size={20} color={ACCENT} /> <span>Full Crew Investigation</span></div>
              ) : (
                <div style={styles.activeCrewBadge}>
                  <Emblem id={activeCrew.id} color={activeCrew.color} size={26} />
                  <span>{activeCrew.name}</span>
                </div>
              )}
              <div style={styles.chatHeaderRight}>
                {unlocked ? (
                  <span style={styles.badgeUnlocked}><IconCheck size={12} /> {t.unlockedBadge}</span>
                ) : (
                  <span style={styles.badgeCount}>{t.questionsLeft(Math.max(0, FREE_LIMIT - questionsUsed))}</span>
                )}
                <button style={styles.linkBtnSmall} onClick={switchCharacter}><IconRotateCcw size={12} /> {t.switchCharacter}</button>
              </div>
            </div>

            <div style={styles.chatScroll} ref={scrollRef}>
              <div style={{ ...styles.introBubble, borderLeft: `3px solid ${isCrewMode ? ACCENT : activeCrew.color}` }}>
                {isCrewMode ? t.crewIntro : t.chatIntroFor(activeCrew.name)}
              </div>
              {messages.map((m, i) => (
                <div key={i} style={{
                  ...styles.bubble,
                  ...(m.role === "user" ? styles.bubbleUser : { ...styles.bubbleBot, borderLeft: `3px solid ${m.color}` }),
                  ...(m.verdict ? styles.bubbleVerdict : {}),
                }}>
                  {m.role === "agent" && <div style={{ ...styles.bubbleAgentName, color: m.color }}>{m.name}{m.verdict ? " · Verdict" : ""}</div>}
                  {m.text}
                </div>
              ))}
              {thinking && <div style={{ ...styles.bubble, ...styles.bubbleBot, ...styles.bubbleThinking }}>{thinkingLabel}</div>}
            </div>

            {!atLimit ? (
              <div style={styles.inputRow}>
                <input style={styles.chatInput} placeholder={t.inputPlaceholder} value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); send(); } }} />
                <button style={{ ...styles.sendBtn, background: isCrewMode ? ACCENT : activeCrew.color }} onClick={send} disabled={thinking}><IconSend size={16} strokeWidth={2} color="#fff" /></button>
              </div>
            ) : (
              <div style={styles.paywallBox}>
                <IconLock size={22} color={ACCENT} />
                <div style={styles.paywallTitle}>{t.paywallTitle}</div>
                <div style={styles.paywallBody}>{t.paywallBody}</div>
                <a style={styles.paywallCtaBtn} href={GUMROAD_CHECKOUT_URL} target="_blank" rel="noopener noreferrer"><IconCoffee size={15} /> {t.paywallCta}</a>
                {!showLicenseForm ? (
                  <button style={styles.linkBtn} onClick={() => setShowLicenseForm(true)}>{t.haveCode}</button>
                ) : (
                  <div style={styles.licenseRow}>
                    <input style={styles.fieldInput} placeholder={t.licensePlaceholder} value={licenseKey} onChange={(e) => setLicenseKey(e.target.value)} />
                    <button style={styles.secondaryBtn} onClick={handleUnlock} disabled={verifying}>{verifying ? t.unlocking : t.unlockBtn}</button>
                    {licenseError && <div style={styles.errorText}>{licenseError}</div>}
                  </div>
                )}
              </div>
            )}
          </section>
        </main>
      )}
    </div>
  );
}
